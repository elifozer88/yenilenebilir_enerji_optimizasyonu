<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İzmir Yenilenebilir Enerji Atlası</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
      #app { width: 100vw; height: 100vh; }

      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #title {
        color: #00f5d4;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1px;
        text-shadow: 0 0 12px #00f5d4aa;
      }

      #subtitle {
        color: #aaa;
        font-size: 11px;
        margin-top: -8px;
        letter-spacing: 0.5px;
      }

      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 8px;
      }

      .layer-btn {
        background: rgba(0,0,0,0.7);
        border: 1px solid #333;
        color: #ccc;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        letter-spacing: 0.5px;
        transition: all 0.2s;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 8px;
        backdrop-filter: blur(4px);
      }

      .layer-btn:hover {
        border-color: #00f5d4;
        color: #fff;
      }

      .layer-btn.active {
        border-color: #00f5d4;
        color: #00f5d4;
        background: rgba(0, 245, 212, 0.1);
        box-shadow: 0 0 10px rgba(0,245,212,0.2);
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      #legend {
        position: absolute;
        bottom: 30px;
        left: 20px;
        background: rgba(0,0,0,0.75);
        border: 1px solid #333;
        border-radius: 8px;
        padding: 12px 16px;
        color: #ccc;
        font-size: 11px;
        backdrop-filter: blur(4px);
        display: none;
        z-index: 10;
      }

      #legend.visible { display: block; }
      #legend h4 { color: #00f5d4; margin-bottom: 8px; font-size: 12px; }

      .legend-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 5px;
      }

      .legend-color {
        width: 24px;
        height: 10px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui">
      <div id="title">İZMİR ENERJİ ATLASI</div>
      <div id="subtitle">Yenilenebilir Enerji Uygunluk Haritası</div>
      <div class="btn-group">
        <button class="layer-btn" id="btn-ges" ">
          <span class="dot" style="background:#f4a261"></span>
         <button class="layer-btn" id="btn-ges">
  <span class="dot" style="background:#f4a261"></span>
  GES Uygunluk Katmanı
</button>
<button class="layer-btn" id="btn-res">
  <span class="dot" style="background:#4cc9f0"></span>
  RES Uygunluk Katmanı
</button>
      </div>
    </div>

    <div id="legend">
      <h4 id="legend-title">Uygunluk Skoru</h4>
      <div class="legend-row"><div class="legend-color" style="background:#1a0a4e"></div> Düşük (1)</div>
      <div class="legend-row"><div class="legend-color" style="background:#2d6a4f"></div> Orta-Düşük (2)</div>
      <div class="legend-row"><div class="legend-color" style="background:#52b788"></div> Orta (3)</div>
      <div class="legend-row"><div class="legend-color" style="background:#95d5b2"></div> Orta-Yüksek (4)</div>
      <div class="legend-row"><div class="legend-color" style="background:#ffff00"></div> Yüksek (5)</div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
