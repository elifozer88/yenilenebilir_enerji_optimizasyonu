version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: ye_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
      POSTGRES_DB: yenilenebilir
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ye_network

  backend:
    build: ./backend
    container_name: ye_backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=yenilenebilir
      - DB_USER=postgres
      - DB_PASS=${DB_PASSWORD:-1234}
      - JWT_SECRET=${JWT_SECRET:-degistir_bunu_guvensiz}
    volumes:
      - ./data:/app/data
      - ./gadm41_TUR_2.json:/app/gadm41_TUR_2.json
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8003:8003"
    networks:
      - ye_network

  frontend:
    build: ./frontend
    container_name: ye_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ye_network

volumes:
  pgdata:

networks:
  ye_network:
    driver: bridge
